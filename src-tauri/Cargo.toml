[package]
name = "compress"
version = "0.1.0"
description = "轻量多格式压缩工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
name = "pdf_compressor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
